name: Auto Content Agent

on:
  push:
    paths:
      - 'input/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai python-dotenv

      - name: Run Agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python agent.py

      - name: Commit and Push results
        run: |
          git config --global user.name "CineForge Agent"
          git config --global user.email "agent@cineforge.shop"
          git add output/
          git commit -m "Update: New content package generated" || echo "No changes to commit"
          git push
